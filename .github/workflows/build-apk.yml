name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atom-vpn-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "\u26a1 ATOM VPN ${{ github.ref_name }}"
          body: |
            ## \u26a1 ATOM VPN ${{ github.ref_name }}

            ### \ud83d\udce5 دانلود
            فایل `app-debug.apk` رو از بخش Assets پایین همین صفحه دانلود کن.

            ### \ud83d\udcf1 نیازمندی‌ها
            - Android 8.0 (API 26) یا بالاتر

            ### \u26a0\ufe0f توجه
            این یک Debug APK است. برای نصب باید **Unknown Sources** را در تنظیمات Android فعال کنی.

            ### \ud83d\udcdc License
            MIT
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
